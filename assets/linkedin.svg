<svg xmlns="http://www.w3.org/2000/svg" width="144" height="36" viewBox="0 0 144 36" role="img" aria-labelledby="title">
<title id="title">LinkedIn ↗</title>
<defs></defs><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
.mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
.orbit { transform-box: fill-box; transform-origin: center; animation: orbit 24s linear infinite; }
.reverse { animation-direction: reverse; animation-duration: 34s; }
.glow { animation: glow 5s ease-in-out infinite; }
.travel { stroke-dasharray: 16 84; animation: travel 8s linear infinite; }
.float { animation: float 6s ease-in-out infinite; }
.typing { animation: typing 10s steps(40, end) infinite; }
.cursor { animation: cursor 1.3s steps(1) infinite; }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes glow { 0%,100% { opacity: .4; } 50% { opacity: .95; } }
@keyframes travel { to { stroke-dashoffset: -100; } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes typing { 0%,8% { width: 0; } 45%,88% { width: 480px; } 100% { width: 0; } }
@keyframes cursor { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
 .orbit,.reverse,.glow,.travel,.float,.typing,.cursor { animation: none !important; }
 .typing { width: 480px; }
 .travel { stroke-dasharray: none; }
}
</style>
<rect x=".5" y=".5" width="143" height="35" rx="9" fill="#11182a" stroke="#344059"/>
    <circle cx="19" cy="18" r="3" fill="#92c6ff"/>
    <text x="33" y="23" fill="#edf2f8" font-size="14" font-weight="600">LinkedIn ↗</text>
</svg>
