<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1105" viewBox="0 0 600 1105" role="img" aria-labelledby="title desc">
<title id="title">My engineering toolkit</title><desc id="desc">Python, TypeScript, SQL, FastAPI, React, Next.js, Supabase, Firebase and Gemini API. A dimensional SVJ monogram with moving orbits.</desc>
<defs>
 <radialGradient id="blue-glow"><stop stop-color="#153b7f" stop-opacity=".65"/><stop offset="1" stop-color="#070c18" stop-opacity="0"/></radialGradient>
 <radialGradient id="red-glow"><stop stop-color="#702638" stop-opacity=".35"/><stop offset="1" stop-color="#070c18" stop-opacity="0"/></radialGradient>
 <linearGradient id="card" x2="1" y2="1"><stop stop-color="#152b49"/><stop offset="1" stop-color="#0d1728"/></linearGradient>
 <linearGradient id="cube" x2="1" y2="1"><stop stop-color="#428dff"/><stop offset="1" stop-color="#174783"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#244365"/></pattern>
