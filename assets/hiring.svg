<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="102" viewBox="0 0 1100 102" role="img" aria-labelledby="title"><title id="title">Open to Python Backend, Full-Stack and AI opportunities in Bengaluru. Junior developer and internship roles.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b2e"/><stop offset="1" stop-color="#080e1c"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#bce891"/><stop offset="1" stop-color="#27364f"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.float{animation:float 6s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 12s linear infinite}@keyframes float{50%{transform:translateY(-7px)}}@keyframes pulse{50%{opacity:.4}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.float,.pulse,.orbit{animation:none}}</style><rect x="1" y="1" width="1098" height="100" rx="22" fill="url(#bg)" stroke="#26324a"/><circle class="pulse" cx="36" cy="34" r="5" fill="#bce891"/><text x="51" y="39" font-size="11" fill="#bce891" font-weight="600" letter-spacing="1.6">OPEN TO OPPORTUNITIES</text><text x="31" y="76" font-size="24" fill="#f3f7ff" font-weight="600" >Python Backend, Full-Stack and AI opportunities in Bengaluru.</text><text x="784" y="38" font-size="10" fill="#b8c6dc" font-weight="600" letter-spacing=".7">JUNIOR DEVELOPER / INTERNSHIPS</text></svg>
