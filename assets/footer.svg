<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="109" viewBox="0 0 1100 109" role="img" aria-labelledby="title"><title id="title">Build. Connect. Improve. — Savvani Venkata Jaswanth</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b2e"/><stop offset="1" stop-color="#080e1c"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#79dfff"/><stop offset="1" stop-color="#27364f"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.float{animation:float 6s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 12s linear infinite}@keyframes float{50%{transform:translateY(-7px)}}@keyframes pulse{50%{opacity:.4}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.float,.pulse,.orbit{animation:none}}</style><rect x="1" y="1" width="1098" height="107" rx="22" fill="url(#bg)" stroke="#26324a"/><text x="34" y="42" font-size="26" fill="#f3f7ff" font-weight="700" >BUILD. CONNECT. IMPROVE.</text><text x="35" y="75" font-size="16" fill="#b8c6dc" font-weight="400" >From a business problem to a working product.</text><text x="994" y="58" font-size="30" fill="#79dfff" font-weight="700" >SVJ</text></svg>
